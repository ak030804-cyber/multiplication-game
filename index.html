<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐣 二年級乘法應用題大冒險</title>
<style>
  :root {
    --bg-1: #fde2e4;
    --bg-2: #bee1e6;
    --bg-3: #f0ead2;
    --primary: #ff6b6b;
    --secondary: #4ecdc4;
    --accent: #ffd93d;
    --dark: #2d3436;
    --good: #00b894;
    --bad: #d63031;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Microsoft JhengHei', 'PingFang TC', system-ui, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  @keyframes gradientBG {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .game-container {
    background: white;
    padding: 2rem;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    text-align: center;
    width: 100%;
    max-width: 480px;
    position: relative;
    overflow: hidden;
  }
  .game-container::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,217,61,0.1) 0%, transparent 70%);
    animation: rotate 20s linear infinite;
    pointer-events: none;
  }
  @keyframes rotate {
    to { transform: rotate(360deg); }
  }
  h1 {
    color: var(--primary);
    margin-bottom: 0.5rem;
    font-size: 1.8rem;
    position: relative;
  }
  .subtitle {
    color: #636e72;
    margin-bottom: 1.5rem;
    font-size: 0.95rem;
    position: relative;
  }
  /* Start screen */
  .start-screen { position: relative; }
  .level-select {
    display: grid;
    gap: 12px;
    margin: 1rem 0 1.5rem;
  }
  .level-btn {
    background: linear-gradient(135deg, #ffeaa7, #fab1a0);
    border: none;
    padding: 14px;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--dark);
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
  }
  .level-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(0,0,0,0.1); }
  .level-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.1); }
  .level-btn .lvl-emoji { font-size: 1.4rem; margin-right: 8px; }
  /* Game UI */
  .game-ui { display: none; position: relative; }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    gap: 8px;
  }
  .stat {
    background: #f8f9fa;
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--dark);
    flex: 1;
    text-align: center;
  }
  .stat .label { font-size: 0.75rem; color: #636e72; display: block; }
  .stat .value { font-size: 1.2rem; color: var(--primary); }
  .progress-bar {
    height: 10px;
    background: #dfe6e9;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 1.5rem;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--secondary), var(--good));
    border-radius: 10px;
    transition: width 0.4s;
    width: 0%;
  }
  .scenario {
    background: linear-gradient(135deg, #fff5e1, #ffeef8);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    border: 3px dashed var(--accent);
    font-size: 1.15rem;
    line-height: 1.7;
    color: var(--dark);
    text-align: left;
    position: relative;
  }
  .scenario .emoji-deco {
    font-size: 2.5rem;
    position: absolute;
    top: -18px;
    right: 12px;
    background: white;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
  .question {
    font-weight: 700;
    color: var(--primary);
    display: block;
    margin-top: 8px;
    font-size: 1.05rem;
  }
  .visual-aid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 12px 0;
    font-size: 1.6rem;
  }
  .visual-group {
    background: white;
    padding: 6px 10px;
    border-radius: 10px;
    border: 2px solid var(--secondary);
  }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 1rem;
  }
  .option {
    background: white;
    border: 3px solid #dfe6e9;
    padding: 14px;
    border-radius: 14px;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--dark);
    cursor: pointer;
    transition: all 0.2s;
  }
  .option:hover:not(:disabled) {
    border-color: var(--secondary);
    transform: scale(1.03);
    background: #e8f9f7;
  }
  .option:disabled { cursor: not-allowed; }
  .option.correct {
    background: var(--good);
    color: white;
    border-color: var(--good);
    animation: bounce 0.5s;
  }
  .option.wrong {
    background: var(--bad);
    color: white;
    border-color: var(--bad);
    animation: shake 0.5s;
  }
  @keyframes bounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .feedback {
    font-size: 1.1rem;
    font-weight: 600;
    min-height: 1.5em;
    margin-bottom: 1rem;
  }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .next-btn {
    background: linear-gradient(135deg, var(--primary), #ff8787);
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    display: none;
    margin: 0 auto;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    transition: all 0.2s;
  }
  .next-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(0,0,0,0.15); }
  .next-btn:active { transform: translateY(2px); }
  /* End screen */
  .end-screen { display: none; position: relative; }
  .end-emoji { font-size: 4rem; margin-bottom: 1rem; }
  .end-title { font-size: 1.6rem; color: var(--primary); margin-bottom: 0.5rem; }
  .end-stats {
    background: #f8f9fa;
    border-radius: 14px;
    padding: 1rem;
    margin: 1rem 0;
  }
  .end-stat-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #dfe6e9;
  }
  .end-stat-row:last-child { border: none; }
  .stars {
    font-size: 1.8rem;
    margin: 0.5rem 0 1rem;
  }
  .star { color: #dfe6e9; }
  .star.filled { color: #ffd93d; }
  .action-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 1rem;
  }
  .action-btns button {
    background: var(--secondary);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    flex: 1;
  }
  .action-btns .home-btn { background: #636e72; }
  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -20px;
    animation: fall 3s linear forwards;
    z-index: 9999;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
  .back-home {
    background: none;
    border: none;
    color: #636e72;
    font-size: 0.85rem;
    cursor: pointer;
    margin-top: 1rem;
    text-decoration: underline;
    display: none;
  }
</style>
</head>
<body>
<div class="game-container">
  <h1>🐣 乘法應用題大冒險</h1>
  <p class="subtitle">一起來解生活化的乘法問題！</p>

  <!-- Start Screen -->
  <div class="start-screen" id="startScreen">
    <p style="margin-bottom:1rem; color:#636e72;">選擇挑戰難度：</p>
    <div class="level-select">
      <button class="level-btn" data-level="easy">
        <span class="lvl-emoji">🌱</span> 初級：2、5、10 的乘法
      </button>
      <button class="level-btn" data-level="medium">
        <span class="lvl-emoji">🌟</span> 中級：1～5 的乘法表
      </button>
      <button class="level-btn" data-level="hard">
        <span class="lvl-emoji">🚀</span> 進階：1～9 的乘法表
      </button>
    </div>
  </div>

  <!-- Game Screen -->
  <div class="game-ui" id="gameScreen">
    <div class="top-bar">
      <div class="stat">
        <span class="label">第幾題</span>
        <span class="value"><span id="qIndex">1</span>/<span id="qTotal">8</span></span>
      </div>
      <div class="stat">
        <span class="label">得分</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="label">連對</span>
        <span class="value" id="streak">0</span>
      </div>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="scenario" id="scenario">
      <div class="emoji-deco" id="sceneEmoji">🍎</div>
      <div id="sceneText">每盤有 3 個蘋果...</div>
      <span class="question" id="question">請問 4 盤共有多少個蘋果？</span>
    </div>
    <div class="visual-aid" id="visualAid"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">下一題 ➡️</button>
  </div>

  <!-- End Screen -->
  <div class="end-screen" id="endScreen">
    <div class="end-emoji" id="endEmoji">🎉</div>
    <div class="end-title" id="endTitle">挑戰完成！</div>
    <div class="stars" id="stars"></div>
    <div class="end-stats" id="endStats"></div>
    <div class="action-btns">
      <button id="againBtn">再玩一次 🔄</button>
      <button class="home-btn" id="homeBtn">回首頁 🏠</button>
    </div>
  </div>

  <button class="back-home" id="backHome">↩️ 回到首頁</button>
</div>

<script>
// =========================================
// 題庫生成器
// =========================================
const SCENARIOS = {
  apple: { emoji: '🍎', name: '蘋果', icon: '🍏' },
  egg: { emoji: '🥚', name: '雞蛋', icon: '🥚' },
  flower: { emoji: '🌸', name: '花朵', icon: '🌺' },
  fish: { emoji: '🐟', name: '魚', icon: '🐠' },
  star: { emoji: '⭐', name: '星星', icon: '✨' },
  cake: { emoji: '🍰', name: '蛋糕', icon: '🧁' },
  balloon: { emoji: '🎈', name: '氣球', icon: '🎉' },
  car: { emoji: '🚗', name: '車子', icon: '🚙' },
  candy: { emoji: '🍬', name: '糖果', icon: '🍭' },
  butterfly: { emoji: '🦋', name: '蝴蝶', icon: '🌈' },
  pencil: { emoji: '✏️', name: '鉛筆', icon: '📚' },
  rabbit: { emoji: '🐰', name: '兔子', icon: '🥕' },
  bird: { emoji: '🐦', name: '小鳥', icon: '🌳' },
  cupcake: { emoji: '🧁', name: '杯子蛋糕', icon: '🍰' },
  coin: { emoji: '🪙', name: '硬幣', icon: '💰' },
  icecream: { emoji: '🍦', name: '冰淇淋', icon: '🍨' },
  kite: { emoji: '🦁', name: '小獅子', icon: '🦁' },
  chair: { emoji: '🪑', name: '椅子', icon: '🪑' },
  book: { emoji: '📖', name: '書', icon: '📚' },
  leaf: { emoji: '🍃', name: '葉子', icon: '🌿' },
};

const CONTAINERS = [
  { name: '盤', emoji: '🍽️' },
  { name: '箱', emoji: '📦' },
  { name: '盒', emoji: '🎁' },
  { name: '籃', emoji: '🧺' },
  { name: '排', emoji: '➡️' },
  { name: '袋', emoji: '🛍️' },
  { name: '堆', emoji: '⛰️' },
  { name: '組', emoji: '👥' },
];

const PEOPLE = [
  { name: '同學', emoji: '👧' },
  { name: '小朋友', emoji: '🧒' },
  { name: '小朋友', emoji: '👶' },
  { name: '學生', emoji: '🧑‍🎓' },
  { name: '朋友', emoji: '🧑‍🤝‍🧑' },
];

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 根據難度取乘法範圍
function getMultipliers(level) {
  if (level === 'easy') return [2, 5, 10];
  if (level === 'medium') return [1, 2, 3, 4, 5];
  return [1, 2, 3, 4, 5, 6, 7, 8, 9];
}

// 情境模板產生器（每題從多種情境裡隨機抽一個）
const TEMPLATES = [
  (item, a, b) => ({
    text: `一${rand(CONTAINERS).name}${item.name}有 ${a} 個，${b}${rand(CONTAINERS).name}共有多少個${item.name}？`,
    icon: item.icon,
    visual: () => {
      const groups = Array(b).fill(0).map(() => `${item.emoji}`.repeat(a));
      return groups.map(g => `<div class="visual-group">${g}</div>`).join('');
    }
  }),
  (item, a, b) => {
    const p = rand(PEOPLE);
    return {
      text: `${b} 位${p.name}，每人分到 ${a} 個${item.name}，一共有多少個${item.name}？`,
      icon: p.emoji + item.icon,
      visual: () => {
        const groups = Array(b).fill(0).map(() => `${item.emoji}`.repeat(a));
        return groups.map(g => `<div class="visual-group">${g}</div>`).join('');
      }
    };
  },
  (item, a, b) => ({
    text: `${item.name} ${a}${rand(['個', '隻', '朵', '顆', '條']).replace('朵', '個')}一${rand(CONTAINERS).name}，買 ${b}${rand(CONTAINERS).name}，共${item.name}多少${rand(['個', '隻', '朵', '顆'])}？`,
    icon: item.icon,
    visual: () => `<div class="visual-group">${item.emoji.repeat(a * b / Math.min(a, b) >= 9 ? Math.min(a, b) : a * b)}</div>`,
    bigVisual: a * b
  }),
  (item, a, b) => ({
    text: `一個${item.name}有 ${a} 隻腳，${b} 個${item.name}共有幾隻腳？`,
    icon: item.icon,
    visual: () => Array(b).fill(0).map(() => `<div class="visual-group">${item.emoji}</div>`).join(''),
    // Note: "腳" answers might exceed level — skip easily
  }),
  (item, a, b) => ({
    text: `弟弟有 ${a} 個${item.name}，哥哥的是弟弟的 ${b} 倍，哥哥有多少個${item.name}？`,
    icon: item.icon,
    visual: () => {
      const groups = Array(b).fill(0).map(() => `${item.emoji}`.repeat(a));
      return groups.map(g => `<div class="visual-group">${g}</div>`).join('');
    }
  }),
  (item, a, b) => ({
    text: `一星期有 7 天，${b} 星期共有幾天？`,
    icon: '📅',
    visual: () => Array(b).fill(0).map(() => `<div class="visual-group">📅×7</div>`).join(''),
    // 固定一題：7 × b
    forceArgs: [7, b]
  }),
];

function generateQuestion(level) {
  const keys = Object.keys(SCENARIOS);
  const item = SCENARIOS[keys[randInt(0, keys.length - 1)]];
  const multipliers = getMultipliers(level);
  let a, b;
  let tries = 0;
  while (tries < 50) {
    a = rand(multipliers);
    b = rand(multipliers);
    // 答案不能太大（避免 9×9=81 也可以，但要湊視覺化）
    if (a * b <= 64) break;
    tries++;
  }
  // 二年級：通常 a*b <= 50 比較常見，但允許大一點
  const tpl = rand(TEMPLATES);
  let result = tpl(item, a, b);
  if (result.forceArgs) {
    a = result.forceArgs[0];
    b = result.forceArgs[1];
  }
  const answer = a * b;
  // 選項：正確答案 + 3 個接近的錯答案
  const wrongOptions = new Set();
  while (wrongOptions.size < 3) {
    const offset = randInt(-10, 10);
    if (offset === 0) continue;
    const wrong = answer + offset;
    if (wrong > 0 && wrong !== answer) wrongOptions.add(wrong);
  }
  const options = shuffle([answer, ...wrongOptions]);
  return {
    text: result.text,
    icon: result.icon,
    visual: result.visual(),
    answer,
    options
  };
}

// =========================================
// 遊戲狀態
// =========================================
const state = {
  level: 'medium',
  questions: [],
  current: 0,
  score: 0,
  streak: 0,
  bestStreak: 0,
  answered: false,
};

const TOTAL_Q = 8;

// =========================================
// UI 控制
// =========================================
const startScreen = document.getElementById('startScreen');
const gameScreen = document.getElementById('gameScreen');
const endScreen = document.getElementById('endScreen');
const backHome = document.getElementById('backHome');

document.querySelectorAll('.level-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.level = btn.dataset.level;
    startGame();
  });
});

document.getElementById('againBtn').addEventListener('click', startGame);
document.getElementById('homeBtn').addEventListener('click', goHome);
backHome.addEventListener('click', goHome);

function startGame() {
  state.questions = Array(TOTAL_Q).fill(0).map(() => generateQuestion(state.level));
  state.current = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  startScreen.style.display = 'none';
  endScreen.style.display = 'none';
  gameScreen.style.display = 'block';
  backHome.style.display = 'block';
  renderQuestion();
}

function goHome() {
  startScreen.style.display = 'block';
  endScreen.style.display = 'none';
  gameScreen.style.display = 'none';
  backHome.style.display = 'none';
}

function renderQuestion() {
  const q = state.questions[state.current];
  document.getElementById('qIndex').textContent = state.current + 1;
  document.getElementById('qTotal').textContent = TOTAL_Q;
  document.getElementById('score').textContent = state.score;
  document.getElementById('streak').textContent = state.streak;
  document.getElementById('progressFill').style.width = ((state.current) / TOTAL_Q * 100) + '%';
  document.getElementById('sceneEmoji').textContent = q.icon.slice(0, 2) || '📝';
  document.getElementById('sceneText').innerHTML = q.text;
  document.getElementById('visualAid').innerHTML = q.visual;
  const feedback = document.getElementById('feedback');
  feedback.textContent = '';
  feedback.className = 'feedback';
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(opt, btn);
    opts.appendChild(btn);
  });
  document.getElementById('nextBtn').style.display = 'none';
  state.answered = false;
}

function handleAnswer(choice, btn) {
  if (state.answered) return;
  state.answered = true;
  const q = state.questions[state.current];
  const isCorrect = choice === q.answer;
  // 標記選項
  document.querySelectorAll('.option').forEach(o => {
    o.disabled = true;
    if (parseInt(o.textContent) === q.answer) o.classList.add('correct');
    else if (o === btn && !isCorrect) o.classList.add('wrong');
  });
  const feedback = document.getElementById('feedback');
  if (isCorrect) {
    state.score += 10 + state.streak * 2; // 連對獎勵
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    feedback.textContent = ['太棒了！🎉', '答對囉！👏', '聰明！🌟', '完美！💯'][randInt(0,3)];
    feedback.className = 'feedback good';
    launchConfetti();
  } else {
    state.streak = 0;
    feedback.textContent = `正確答案是 ${q.answer}，再想想看！💪`;
    feedback.className = 'feedback bad';
  }
  document.getElementById('score').textContent = state.score;
  document.getElementById('streak').textContent = state.streak;
  document.getElementById('nextBtn').style.display = 'inline-block';
}

document.getElementById('nextBtn').addEventListener('click', () => {
  state.current += 1;
  if (state.current >= TOTAL_Q) {
    endGame();
  } else {
    renderQuestion();
  }
});

function endGame() {
  gameScreen.style.display = 'none';
  endScreen.style.display = 'block';
  document.getElementById('progressFill').style.width = '100%';
  const maxScore = TOTAL_Q * 10; // 不計 streak
  const percentage = state.score / maxScore;
  let stars, emoji, title;
  if (percentage >= 0.9) {
    stars = 3; emoji = '🏆'; title = '數學小天才！';
  } else if (percentage >= 0.7) {
    stars = 2; emoji = '🌟'; title = '很棒唷！';
  } else if (percentage >= 0.5) {
    stars = 1; emoji = '😊'; title = '繼續加油！';
  } else {
    stars = 0; emoji = '💪'; title = '別灰心，再練一次！';
  }
  document.getElementById('endEmoji').textContent = emoji;
  document.getElementById('endTitle').textContent = title;
  document.getElementById('stars').innerHTML = [0,1,2].map(i =>
    `<span class="star ${i < stars ? 'filled' : ''}">★</span>`
  ).join('');
  document.getElementById('endStats').innerHTML = `
    <div class="end-stat-row"><span>總得分</span><strong>${state.score} 分</strong></div>
    <div class="end-stat-row"><span>答對題數</span><strong>${state.questions.filter((q,i) => state.questionAnswered?.[i]).length || '計算中'} 題</strong></div>
    <div class="end-stat-row"><span>最長連對</span><strong>${state.bestStreak} 題</strong></div>
  `;
  // 用 score 反推答對率（每題 10 分起跳）
  const correct = Math.min(TOTAL_Q, Math.floor(state.score / 10));
  document.getElementById('endStats').innerHTML = `
    <div class="end-stat-row"><span>總得分</span><strong>${state.score} 分</strong></div>
    <div class="end-stat-row"><span>答對題數</span><strong>${correct} / ${TOTAL_Q}</strong></div>
    <div class="end-stat-row"><span>最長連對</span><strong>${state.bestStreak} 題</strong></div>
  `;
  if (percentage >= 0.7) launchConfetti();
}

// 紙屑
function launchConfetti() {
  const colors = ['#ff6b6b', '#4ecdc4', '#ffd93d', '#a29bfe', '#fd79a8', '#00b894'];
  for (let i = 0; i < 40; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[randInt(0, colors.length - 1)];
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    piece.style.transform = `rotate(${randInt(0,360)}deg)`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 3500);
  }
}
</script>
</body>
</html>
